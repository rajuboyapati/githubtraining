    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alok Dragging Form</title>
  
  <!-- మనం పైన క్రియేట్ చేసిన CSS ఫైల్ ని ఇక్కడ లింక్ చేస్తున్నాం -->
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

<div class="drag-scene">
  
  <!-- DJ Alok SVG Character -->
  <div class="alok-svg">
    <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Body/Coat pulling -->
      <path d="M 40 75 L 20 100 L 80 100 L 60 75 Z" fill="#2a2a2a"/>
      <!-- Face -->
      <circle cx="50" cy="50" r="20" fill="#ffccaa"/>
      <!-- Sunglasses -->
      <rect x="32" y="44" width="16" height="8" rx="2" fill="#111"/>
      <rect x="52" y="44" width="16" height="8" rx="2" fill="#111"/>
      <path d="M 48 48 L 52 48" stroke="#111" stroke-width="2"/>
      <!-- Hair -->
      <path d="M 30 38 Q 50 20 70 38 Q 60 25 30 38" fill="#333"/>
      <!-- Headphones -->
      <path d="M 25 45 A 25 25 0 0 1 75 45" fill="none" stroke="#00ffcc" stroke-width="3"/>
      <rect x="20" y="42" width="8" height="16" rx="3" fill="#333"/>
      <rect x="72" y="42" width="8" height="16" rx="3" fill="#333"/>
      <!-- Arm pulling the rope -->
      <path d="M 60 80 L 95 65" stroke="#ffccaa" stroke-width="8" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- The Rope -->
  <div class="rope"></div>

  <!-- The Login Form -->
  <div class="login-box">
    <h2>Squad Login</h2>
    <input type="text" placeholder="Player ID / Username">
    <input type="password" placeholder="Password">
    <button>Drop In</button>
  </div>

</div>

</body>
</html>

</body>
</html>
